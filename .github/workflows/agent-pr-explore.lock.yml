# Placeholder for PR Explore Agent.
#
# GitHub only reliably triggers pull_request workflows once a workflow
# file with the same path exists on the default branch. The real
# generated gh-aw workflow is introduced by PR #2604; this placeholder
# is intentionally inert and can be replaced by the compiled workflow
# when that PR merges.
name: "PR Explore Agent - placeholder"

# Automatic triggers are disabled in this fork: the upstream schedules and
# push/pull_request hooks depend on secrets and infrastructure this fork does
# not have (release buckets, Feishu/Discord webhooks, Search Console, deploy
# targets), so they only ever fail. Every workflow stays runnable on demand
# from the Actions tab, and restoring a trigger is a small revert.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  placeholder:
    name: Placeholder
    if: ${{ github.event_name == 'agent_pr_explore_placeholder_never' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "agent-pr-explore placeholder only"
